[project]
name = "iampe"
version = "0.1.0"
description = "Greybox IAM privilege-escalation remediation game"
requires-python = ">=3.10"
dependencies = [
  "python-hcl2>=8",
  "networkx>=3.2",
  "numpy",
  "pulp>=2.8",
  "highspy>=1.7",
  "gymnasium>=1.0",
  "torch>=2.2",
  "torch_geometric>=2.5",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iampe*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
